[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "konfid"
version = "0.3.0"
description = "Cross-system security control plane for identity bindings, scoped authorization, risk detection, containment, approvals, and auditable response."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<0.143",
  "uvicorn>=0.35,<0.55",
  "sqlalchemy>=2.0.50,<2.2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<0.29",
  "PyJWT[crypto]>=2.13,<3",
  "alembic>=1.16,<2",
  "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8.4,<9", "pytest-cov>=6,<8"]

[project.scripts]
konfid = "konfid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
