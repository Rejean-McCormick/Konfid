name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: pip install -e '.[test]'
      - run: pytest
      - run: python -m compileall -q src tests
      - name: Migration round-trip (SQLite structural check)
        run: |
          rm -f /tmp/konfid-ci.db
          KONFID_DATABASE_URL=sqlite:////tmp/konfid-ci.db alembic upgrade head
          KONFID_DATABASE_URL=sqlite:////tmp/konfid-ci.db alembic downgrade base
          KONFID_DATABASE_URL=sqlite:////tmp/konfid-ci.db alembic upgrade head
      - name: Generate OpenAPI
        run: PYTHONPATH=src python -c "import json; from konfid.app import app; json.dump(app.openapi(), open('/tmp/openapi.json','w'))"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: konfid
          POSTGRES_USER: konfid
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konfid -d konfid"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KONFID_DATABASE_URL: postgresql+psycopg://konfid:test-only@127.0.0.1:5432/konfid
      KONFID_DEV_MODE: 'true'
      KONFID_ENV: test
      KONFID_POLICY_MODE: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: pip install -c constraints/production-linux.txt -e '.[test,postgres]'
      - name: PostgreSQL migration round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: PostgreSQL invariant suite
        run: pytest

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1" "build==1.6.1" pip-audit
      - run: pip install -c constraints/production-linux.txt -e '.[postgres]'
      - run: pip check
      - run: pip-audit --strict
      - name: Generate CycloneDX SBOM
        run: pip-audit --strict --format cyclonedx-json > sbom.cdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: konfid-sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - run: python -m build --wheel

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --pull --tag konfid:ci .
      - name: Verify runtime user
        run: test "$(docker run --rm --entrypoint id konfid:ci -u)" = "10001"
